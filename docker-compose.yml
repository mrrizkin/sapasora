services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sapasora}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        TDLIB_COMMIT: 971684a3dcc7bdf99eec024e1c4f57ae729d6d53
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "-c", "/usr/local/bin/toolbox migrate run && exec /usr/local/bin/sapasora"]
    volumes:
      - tdlib-data:/app/.tdlib
      - app-storage:/app/storage

volumes:
  postgres-data:
  tdlib-data:
  app-storage:
